name: Aestheticpartners
description: 'Aesthetic Partners is a clinical-aesthetics practice-management company that partners
  with physician-led medical aesthetics, cosmetic dermatology, and plastic surgery clinics to help them
  grow through expansion rather than consolidation. It provides partner practices with capital, marketing,
  HR, recruiting, IT, accounting, and legal support, plus professional development and new-clinic launch
  help. Incubated at Harvard and distinguished as female- and minority-owned, the company operates a
  network of practices across California, Florida, North Carolina, and Virginia, is headquartered in
  Miami, FL, and is backed by a strategic investment from Norwest Venture Partners. Aesthetic Partners
  is a non-technical healthcare-services business and does not currently publish a public API, developer
  portal, or technical documentation.'
